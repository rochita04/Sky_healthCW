{% extends 'voting_app/base.html' %}
{% load static %}

{% block title %}Select Your Role - Sky Health Check{% endblock %}

{% block content %}
<div class="role-selection-container">
    <img src="{% static 'voting_app/images/sky_logo.png' %}" alt="Sky Logo" class="logo">
    <h1 class="main-title">Squad Health Check System</h1>
    <h2 class="subheading">Select Your Role</h2>

    <div class="role-select-section">
        <label for="role-select" class="role-label">Choose Your Role:</label>
        <select id="role-select" class="role-dropdown">
            <option value="">-- Select a Role --</option>
        </select>
    </div>

    <button id="assign-role-btn" class="btn-primary-custom" disabled>Assign Role</button>
    <p id="message" class="message-area"></p>
</div>

<!-- ✅ Link to JS -->
<script src="{% static 'voting_app/js/role_selection.js' %}"></script>
{% endblock %}
